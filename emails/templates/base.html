<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#f4fafb;font-family:Arial,Helvetica,sans-serif;color:#163a44;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{PREHEADER}}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4fafb;width:100%;">
    <tr>
      <td align="center" style="padding:28px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="background-color:#16697A;padding:22px 28px;">
              <p style="margin:0;font-size:22px;line-height:1.2;font-weight:700;color:#ffffff;letter-spacing:-0.02em;">
                Meridian
              </p>
              <p style="margin:6px 0 0;font-size:13px;line-height:1.4;color:#82C0CC;">
                Managed websites for salons, barbers &amp; restaurants
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px;background-color:#ffffff;">
              {{CONTENT}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;background-color:#ffffff;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#e8f4f6;border-radius:20px;">
                <tr>
                  <td style="padding:18px 20px;font-size:12px;line-height:1.55;color:#4a6b73;">
                    <p style="margin:0 0 8px;">
                      You are receiving this because you subscribed to Meridian promotional emails.
                    </p>
                    <p style="margin:0 0 8px;">
                      Meridian · {{POSTAL_ADDRESS}}
                    </p>
                    <p style="margin:0;">
                      <a href="{{UNSUBSCRIBE_URL}}" style="color:#16697A;text-decoration:underline;">Unsubscribe</a>
                      &nbsp;·&nbsp;© {{CURRENT_YEAR}} Meridian
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
